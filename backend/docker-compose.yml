# Starts PostgreSQL and the API together:  docker compose up --build
# The API runs migrations and seeds demo data on first start (see README for the seeded logins).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: downtime_tracker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d downtime_tracker"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/downtime_tracker
      JWT_SECRET: dev-only-secret-change-me-dev-only-secret-change-me
      CORS_ORIGIN: http://localhost:5173
      # The frontend dev server proxies to this API over http, so the cookie must not require HTTPS locally.
      NODE_ENV: development
    ports:
      - "4000:4000"
    command: sh -c "node scripts/migrate.js && node scripts/seed.js --if-empty && node src/server.js"

volumes:
  pgdata:
